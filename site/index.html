*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; scroll-padding-top: calc(var(--header-h) + 16px); }
html, body { cursor: var(--paw); }
a, button, [role="button"], summary, label[for], .case-card, .tag, .filter { cursor: var(--paw-hot); }
.figure .frame { cursor: var(--paw-hot); }
body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.6 var(--font); overflow-x: clip; -webkit-font-smoothing: antialiased; transition: background-color .25s, color .25s; }
img { max-width: 100%; height: auto; display: block; }
a { color: inherit; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; }
h1, h2, h3, h4, p, ul, ol, figure { margin: 0; }
ul, ol { padding: 0; }
:focus-visible { outline: 1.5px solid var(--faint); outline-offset: 4px; border-radius: 10px; }
.wrap { width: 100%; max-width: var(--max); margin: 0 auto; padding: 0 var(--gutter); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: 12px; top: -60px; z-index: 100; background: var(--accent); color: var(--on-accent); padding: 10px 16px; border-radius: 999px; text-decoration: none; }
.skip:focus { top: 12px; }
.eyebrow { font: 500 12px/1.4 var(--font-accent); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.prose a, a.inline { color: var(--accent); text-decoration: underline; text-decoration-color: var(--accent-line); text-underline-offset: 3px; transition: text-decoration-color .15s; }
.prose a:hover, a.inline:hover { text-decoration-color: currentColor; }

/* ---------- header ---------- */
.header { position: sticky; top: 0; z-index: 50; background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: saturate(1.4) blur(14px); -webkit-backdrop-filter: saturate(1.4) blur(14px); border-bottom: 1px solid transparent; transition: border-color .2s; }
.header.scrolled { border-bottom-color: var(--border); }
.header .wrap { height: var(--header-h); display: flex; align-items: center; gap: 12px; }
.logo { min-width: 0; overflow: hidden; text-overflow: ellipsis; font: 600 clamp(14px, 4vw, 17px)/1.2 var(--font-accent); letter-spacing: -.01em; text-decoration: none; white-space: nowrap; display: inline-flex; align-items: center; gap: 8px; }
.nav { display: none; gap: 2px; margin-left: 20px; }
.nav a { position: relative; text-decoration: none; color: var(--muted); font-size: 14.5px; padding: 8px 11px; border-radius: 999px; transition: color .15s; }
.nav a:hover { color: var(--text); }
.nav a.active { color: var(--text); }
.nav a.active::after { content: ""; position: absolute; left: 50%; bottom: 1px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); transform: translateX(-50%); }
.tools { flex: none; margin-left: auto; display: flex; align-items: center; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; padding: 3px; background: var(--surface); }
.seg button { font: 500 12.5px/1 var(--font-accent); padding: 7px 10px; border-radius: 999px; color: var(--muted); transition: background .15s, color .15s; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--bg); }
.icon-btn { width: 38px; height: 38px; display: inline-grid; place-items: center; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); transition: border-color .15s, color .15s; }
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
.icon-btn svg { width: 18px; height: 18px; }
.theme-sun { display: none; } :root[data-theme="dark"] .theme-sun { display: block; } :root[data-theme="dark"] .theme-moon { display: none; }
.menu-btn { display: inline-grid; }
.header .cv-btn { display: none; }
.header .in-btn { display: none; }
.mobile-nav { display: none; border-top: 1px solid var(--border); padding: 8px var(--gutter) 20px; }
.mobile-nav.open { display: block; }
.mobile-nav a { display: block; padding: 13px 4px; font-size: 17px; text-decoration: none; border-bottom: 1px solid var(--border); color: var(--muted); }
.mobile-nav a.active { color: var(--text); }
.mobile-nav a.btn { display: flex; margin-top: 16px; border-bottom: 0; }

/* ---------- buttons ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 22px; border-radius: 999px; font-weight: 500; font-size: 15px; text-decoration: none; border: 1px solid transparent; transition: background .18s, border-color .18s, color .18s, transform .18s; white-space: nowrap; }
.btn .arr { display: inline-block; transition: transform .18s; }
.btn:hover .arr { transform: translateX(3px); }
.btn-primary { background: var(--text); color: var(--bg); }
.btn-primary:hover { background: color-mix(in srgb, var(--text) 80%, var(--bg)); }
.btn-secondary { border-color: var(--border); background: var(--surface); }
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
.btn-sm { min-height: 38px; padding: 0 16px; font-size: 14px; }
.btn:active { transform: translateY(0); }

/* ---------- sections ---------- */
section.block { padding: 72px 0; }
.sec-head { display: flex; flex-direction: column; gap: 10px; margin-bottom: 36px; max-width: 760px; }
.sec-title { font-size: clamp(36px, 6vw, 64px); line-height: 1.04; font-weight: 500; letter-spacing: -.035em; }
.sec-sub { color: var(--muted); font-size: 18px; line-height: 1.55; }

/* hero */
.hero { padding: 40px 0 56px; }
.hero-grid { display: grid; gap: 32px; align-items: center; }
.hero-photo { width: min(320px, 72vw); aspect-ratio: 4 / 5; border-radius: 32px; overflow: hidden; background: var(--surface-2); }
.hero-photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 20%; }
.hero-copy { container-type: inline-size; }
.hero-hi, .hero-title { font-size: clamp(32px, 7.4cqw, 64px); line-height: 1.1; font-weight: 500; letter-spacing: -.04em; }
.hero-hi { color: var(--text); margin-bottom: 4px; }
.hero-title { color: var(--faint); }
.hero-title strong { color: var(--text); font-weight: 500; }
.hero-pitch { margin-top: 24px; font-size: 17px; color: var(--muted); max-width: 62ch; line-height: 1.6; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 28px; }
.domains { margin-top: 26px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; }
.domains b { font-weight: 500; color: var(--text); }

/* about */
.about-card { background: var(--surface); border-radius: var(--radius); padding: 28px 22px; box-shadow: var(--shadow); display: grid; gap: 28px; }
.about-text { display: grid; gap: 18px; font-size: 17.5px; line-height: 1.7; color: var(--muted); max-width: 65ch; }
.about-text p:first-child { color: var(--text); font-size: clamp(20px, 2.2vw, 24px); line-height: 1.5; letter-spacing: -.015em; }
.about-side { display: grid; gap: 20px; align-content: start; }
.fact { border-top: 1px solid var(--border); padding-top: 14px; }
.fact .eyebrow { margin-bottom: 6px; }
.fact p { font-size: 15.5px; line-height: 1.55; }

/* tags */
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { display: inline-flex; align-items: center; gap: 7px; font: 500 13px/1.25 var(--font-accent); padding: 7px 12px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); transition: border-color .18s, background .18s, color .18s; }
.tag.skill { background: var(--surface); color: var(--text); border-color: var(--border); }
.tag.key { border-color: var(--accent-line); }
.tag.tool::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .7; }
.tag:hover, button.tag:focus-visible { border-color: var(--text); }
button.tag[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.badge { display: inline-flex; align-items: center; gap: 6px; font: 500 12px/1 var(--font-accent); padding: 6px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); letter-spacing: .02em; }

/* cases */
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
.filter { font-size: 14.5px; padding: 9px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); transition: all .15s; }
.filter:hover { color: var(--text); border-color: var(--text); }
.filter[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.filter .n { opacity: .55; margin-left: 4px; }
.hl-note { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin: -8px 0 22px; color: var(--muted); font-size: 14.5px; }
.cases-grid { display: grid; gap: 20px; grid-template-columns: 1fr; }
.case-card { display: flex; flex-direction: column; text-decoration: none; background: var(--surface); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); box-shadow: var(--shadow); transition: transform .25s, border-color .25s, opacity .25s; }
.case-card:hover { transform: translateY(-4px); border-color: var(--accent-line); }
.case-card.dim { opacity: .35; }
.case-card.hit { border-color: var(--accent); }
.case-card[hidden] { display: none; }
.cover { position: relative; aspect-ratio: 4 / 3; overflow: hidden; background: var(--surface-2); }
.case-card .cover { container-type: inline-size; }
.case-body { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 20px 22px 24px; }
.case-title { font-size: 20px; line-height: 1.25; font-weight: 500; letter-spacing: -.02em; }
.case-line { color: var(--muted); font-size: 15px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.card-foot { margin-top: auto; padding-top: 14px; display: flex; align-items: center; flex-wrap: wrap; gap: 10px; }
.card-foot .tag { margin-left: auto; }
.case-card:hover .btn .arr { transform: translateX(3px); }
.empty-note { color: var(--muted); padding: 24px 4px; }

/* covers */
.cv-tam { display: grid; place-items: center; background: linear-gradient(160deg, var(--cover-soft), transparent 70%), var(--surface-2); }
.circles { position: relative; width: 82%; aspect-ratio: 1.75 / 1; }
.circles .c { position: absolute; top: 50%; border-radius: 50%; display: grid; place-items: center; text-align: center; transform: translateY(-50%); }
.circles .c b { display: block; font: 600 clamp(12px, 2.4vw, 20px)/1.1 var(--font-accent); letter-spacing: -.01em; }
.circles .c small { display: block; font: 500 10px/1.2 var(--font-accent); letter-spacing: .12em; opacity: .85; margin-bottom: 3px; }
.circles .c1 { left: 0; width: 57%; aspect-ratio: 1; background: #2f3f9b; color: #fff; justify-items: start; padding-left: 13%; }
.circles .c2 { left: 41%; width: 38%; aspect-ratio: 1; background: #5a7fe6; color: #fff; justify-items: start; padding-left: 9%; }
.circles .c3 { left: 70%; width: 30%; aspect-ratio: 1; background: #a9c1f5; color: #182259; }
.cv-bars { padding: 9% 9% 7%; display: grid; align-content: center; gap: 10px; background: var(--surface-2); }
.cv-bars .r { display: grid; grid-template-columns: 1fr; gap: 4px; }
.cv-bars .l { font-size: 12.5px; color: var(--muted); display: flex; justify-content: space-between; }
.cv-bars .t { height: 10px; border-radius: 999px; background: var(--border); overflow: hidden; }
.cv-bars .f { height: 100%; border-radius: inherit; background: var(--cover); opacity: .45; }
.cv-bars .r:first-child .f { opacity: 1; }
.cv-type { display: grid; align-content: center; gap: 4px; padding: 8%; background: var(--cover); color: var(--on-cover); }
.cv-type .big { font: 600 clamp(54px, 9vw, 92px)/.95 var(--font-accent); letter-spacing: -.04em; }
.cv-type .lbl { font: 500 13px/1.3 var(--font-accent); letter-spacing: .12em; text-transform: uppercase; opacity: .8; }
.cv-type .row { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.cv-type .mid { font: 600 clamp(28px, 4vw, 40px)/1 var(--font-accent); letter-spacing: -.03em; opacity: .9; margin-top: 18px; }
.case-card .circles .c b { font-size: clamp(10px, 3.3cqw, 16px); }
.case-card .cv-type .big { font-size: clamp(44px, 22cqw, 84px); }
.case-card .cv-type .mid { font-size: clamp(22px, 9cqw, 36px); }
.cv-phone { background: #1a1210; display: flex; justify-content: center; align-items: flex-end; padding-top: 8%; }
.cv-phone img { width: 46%; border-radius: 20px 20px 0 0; }

/* speaking */
.talk { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 26px 22px; display: grid; gap: 22px; box-shadow: var(--shadow); }
.talk-date { display: flex; flex-direction: column; justify-content: space-between; gap: 12px; padding: 22px; border-radius: var(--radius-sm); background: var(--accent-soft); color: var(--accent); min-height: 160px; }
.talk-date .d { font: 600 64px/.9 var(--font-accent); letter-spacing: -.05em; }
.talk-date .m { font: 500 15px/1.3 var(--font-accent); }
.talk h3 { font-size: clamp(22px, 2.6vw, 28px); line-height: 1.25; font-weight: 500; letter-spacing: -.02em; }
.talk-meta { display: flex; flex-wrap: wrap; gap: 6px 18px; color: var(--muted); font-size: 14.5px; margin: 12px 0 14px; }
.talk-meta span { display: inline-flex; gap: 6px; }
.talk-meta b { color: var(--text); font-weight: 500; }
.talk p.desc { color: var(--muted); max-width: 65ch; margin-bottom: 16px; }

/* skills */
.skills-grid { display: grid; gap: 14px; }
.skill-group { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 22px; display: grid; gap: 14px; align-content: start; }
.skill-group h3 { font-size: 17px; font-weight: 500; letter-spacing: -.01em; }

/* experience */
.career { list-style: none; display: grid; }
.career li { display: grid; gap: 4px 24px; padding: 20px 0; border-top: 1px solid var(--border); }
.career li:first-child { border-top: 0; padding-top: 0; }
.career li:last-child { padding-bottom: 0; }
.career-when { font: 500 13.5px/1.4 var(--font-accent); color: var(--muted); }
.career-role { display: block; font-size: clamp(19px, 2.2vw, 24px); line-height: 1.25; font-weight: 500; letter-spacing: -.02em; }
.career-path { display: block; margin-top: 5px; color: var(--muted); font-size: 14px; line-height: 1.4; }
.career-co { display: block; margin-top: 4px; color: var(--muted); font-size: 16px; }
.experience-power { margin-top: 20px; }

/* certifications */
.certs { display: grid; gap: 16px; }
.cert { min-width: 0; align-self: start; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 20px; }
.cert-heading { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px 20px; }
.cert-heading h3 { font-size: 19px; font-weight: 500; line-height: 1.35; letter-spacing: -.02em; }
.cert-body { display: grid; gap: 4px; margin-top: 12px; }
.cert-body p { color: var(--muted); font-size: 14px; }
.cert-open { flex: none; }

/* recommendations */
#recommendations { background: linear-gradient(to bottom, #F1F1F0 0%, #FFFFFF 50%, #FFF5F7 100%); }
.recs { display: grid; gap: 16px; }
.rec { display: flex; flex-direction: column; gap: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 22px 22px 18px; box-shadow: var(--shadow); transition: border-color .25s, transform .25s; }
.rec:hover { border-color: var(--accent-line); }
html.js .rec.rv.in:hover { transform: translateY(-2px); }
.rec-mark { display: block; height: 22px; font: 600 56px/.9 var(--font-accent); color: #e8b4c0; user-select: none; }
.rec blockquote { margin: 0; }
.rec blockquote p { font-size: 14.5px; line-height: 1.6; color: var(--text); text-align: justify; hyphens: auto; }
.rec-note { color: var(--faint); font-size: 12px; line-height: 1.4; }
.rec-foot { margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
.rec-who { min-width: 0; display: grid; gap: 2px; }
.rec-role { font-weight: 500; font-size: 15px; line-height: 1.35; }
.rec-meta { font: 500 11.5px/1.4 var(--font-accent); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.rec-in { flex: none; }
.recs-more { margin-top: 20px; display: flex; }

/* footer */
.contact { padding: 96px 0 40px; text-align: center; }
#contact-footer { background: linear-gradient(to bottom, #FFF5F7 0%, #FFF9FA 28%, #F8E3EA 72%, #F5DDE5 100%); }
.contact h2 { font-size: clamp(32px, 4vw, 48px); line-height: 1; font-weight: 500; letter-spacing: -.05em; }
.contact .lead { color: var(--muted); font-size: 18px; margin: 18px auto 36px; max-width: 46ch; }
.contact-links { display: grid; gap: 12px; max-width: 760px; margin: 0 auto; }
.contact-link { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 76px; padding: 0 28px; border-radius: 999px; background: var(--surface); border: 1px solid var(--border); font-size: 19px; text-decoration: none; transition: background-color .18s, color .18s, border-color .18s; }
.contact-link:hover { background: color-mix(in srgb, var(--surface) 88%, var(--bg)); color: var(--accent); border-color: var(--accent); }
#contact-footer .contact-links .contact-link { background: #FFFFFF; color: #252525; border-color: #E8E5E6; transition: background-color .3s ease, color .3s ease, border-color .3s ease; }
#contact-footer .contact-links .contact-link:hover { background: #F5F5F5; color: #252525; border-color: #E8E5E6; }
#contact-footer .contact-links .contact-link[data-cv] { background: #FFFFFF; color: #252525; border-color: #E8E5E6; }
#contact-footer .contact-links .contact-link[data-cv]:hover { background: #F5F5F5; color: #252525; border-color: #E8E5E6; }
#contact-footer .contact-links .contact-link small { color: inherit; }
.contact-link .ext { transition: transform .18s; }
.contact-link:hover .ext { transform: translate(2px, -2px); }
.contact-link { flex-wrap: wrap; min-width: 0; text-align: center; padding-top: 12px; padding-bottom: 12px; }
.contact-link small { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.footer-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px; padding: 28px 0 32px; margin-top: 72px; border-top: 1px solid var(--border); color: var(--muted); font-size: 14px; }
.footer-in { background: #111111; color: #FFFFFF; border-color: #111111; transition: background-color .3s ease, border-color .3s ease, color .3s ease; }
.footer-in:hover { background: #292929; color: #FFFFFF; border-color: #292929; }
:root[data-theme="dark"] #recommendations,
:root[data-theme="dark"] #contact-footer { background: var(--bg); }
:root[data-theme="dark"] .rec-mark { color: var(--cover); opacity: .9; }

/* ---------- case page ---------- */
.case-page { padding: 28px 0 24px; }
.back { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); text-decoration: none; font-size: 15px; padding: 8px 0; }
.back:hover { color: var(--accent); }
.case-hero { padding: 24px 0 32px; display: grid; gap: 18px; }
.case-hero h1 { font-size: clamp(34px, 5.4vw, 64px); line-height: 1.06; font-weight: 500; letter-spacing: -.04em; max-width: 22ch; }
.case-hero .lead { font-size: clamp(18px, 2vw, 21px); color: var(--muted); max-width: 60ch; }
.meta-row { display: grid; gap: 14px; padding: 20px 0 0; border-top: 1px solid var(--border); margin-top: 8px; }
.meta-row .item { display: grid; gap: 4px; }
.meta-row .item p { font-size: 15.5px; }
.case-visual { border-radius: var(--radius); overflow: hidden; background: var(--surface); border: 1px solid var(--border); margin-bottom: 8px; }
.case-visual .cover { aspect-ratio: 16 / 8; }
.case-visual .circles { max-width: 620px; }
h1:focus, section:focus, main:focus { outline: none; }
.case-visual .cv-phone { aspect-ratio: auto; padding: 32px 16px 0; gap: 12px; }
.case-visual .cv-phone img { width: 30%; max-width: 280px; border-radius: 22px 22px 0 0; }
.case-layout { display: grid; gap: 32px; padding-top: 40px; }
.toc { display: none; }
.toc ol { list-style: none; border-left: 1px solid var(--border); display: grid; gap: 2px; }
.toc a { display: flex; align-items: center; gap: 10px; padding: 8px 14px; margin-left: 10px; border-radius: 999px; text-decoration: none; color: var(--muted); font-size: 14.5px; transition: color .15s, background .15s; }
.toc a::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: currentColor; opacity: .6; flex: none; }
.toc a:hover { color: var(--text); }
.toc a.active { color: var(--text); background: var(--accent-soft); }
.toc a.active::before { background: var(--accent); opacity: 1; }
.case-sections { display: grid; gap: 64px; min-width: 0; }
.cs h2 { font-size: clamp(28px, 3.6vw, 42px); line-height: 1.12; font-weight: 500; letter-spacing: -.03em; margin: 8px 0 18px; max-width: 24ch; }
.prose { display: grid; gap: 16px; font-size: 17px; line-height: 1.7; color: var(--muted); max-width: 68ch; }
.prose strong { color: var(--text); font-weight: 600; }
.prose em { color: var(--text); }
.prose ol, .prose ul { display: grid; gap: 10px; padding-left: 1.3em; }
.prose li::marker { color: var(--accent); font-family: var(--font-accent); }
.verdict { display: grid; gap: 10px; padding: 24px; border-radius: var(--radius-sm); background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--accent); max-width: 68ch; }
.verdict b { font: 600 13px/1.3 var(--font-accent); letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
.verdict p { font-size: 21px; line-height: 1.4; letter-spacing: -.015em; }
.stats { display: grid; gap: 12px; margin-top: 8px; }
.stat { padding: 20px 22px; border-radius: var(--radius-sm); background: var(--surface); border: 1px solid var(--border); }
.stat b { display: block; font: 600 30px/1.1 var(--font-accent); letter-spacing: -.03em; }
.stat span { color: var(--muted); font-size: 14.5px; line-height: 1.45; display: block; margin-top: 6px; }
.figure { margin-top: 8px; display: grid; gap: 10px; }
.figure .frame { border-radius: var(--radius-sm); overflow: hidden; border: 1px solid var(--border); background: #fff; display: block; width: 100%; }
.figure figcaption { color: var(--muted); font-size: 14px; line-height: 1.5; max-width: 68ch; }
.figure.narrow { max-width: 420px; }
.chart { padding: 24px 22px; border-radius: var(--radius-sm); background: var(--surface); border: 1px solid var(--border); display: grid; gap: 16px; max-width: 760px; }
.chart .ttl { font-size: 15px; font-weight: 500; }
.bar { display: grid; gap: 6px; }
.bar .top { display: flex; justify-content: space-between; gap: 12px; font-size: 15px; }
.bar .top b { font: 600 15px/1.4 var(--font-accent); white-space: nowrap; }
.bar .top small { color: var(--muted); font-weight: 400; font-family: var(--font); }
.bar .track { height: 12px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; }
.bar .fill { height: 100%; border-radius: inherit; background: var(--cover); opacity: .5; transform-origin: left; }
.bar:first-of-type .fill { opacity: 1; }
.tbl { width: 100%; max-width: 760px; border-collapse: collapse; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; font-size: 15.5px; }
.tbl th, .tbl td { text-align: left; padding: 14px 18px; border-bottom: 1px solid var(--border); vertical-align: top; line-height: 1.5; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl th { font: 500 12px/1.4 var(--font-accent); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); }
.tbl td:first-child { color: var(--muted); width: 38%; }
.tbl td b { font-family: var(--font-accent); font-weight: 600; }
.points { display: grid; gap: 12px; }
.point { padding: 20px 22px; border-radius: var(--radius-sm); background: var(--surface); border: 1px solid var(--border); }
.point h3 { font-size: 17px; font-weight: 500; margin-bottom: 6px; }
.point p { color: var(--muted); font-size: 15.5px; line-height: 1.6; }
.cta-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
.kit { display: grid; gap: 28px; padding: 32px 0 0; border-top: 1px solid var(--border); }
.kit-row { display: grid; gap: 12px; }
.next { display: grid; gap: 6px; margin-top: 72px; padding: 28px 24px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); text-decoration: none; transition: border-color .2s; }
.next:hover { border-color: var(--accent); }
.next .t { font-size: clamp(22px, 3vw, 32px); font-weight: 500; letter-spacing: -.025em; line-height: 1.2; display: flex; justify-content: space-between; gap: 16px; align-items: center; }
.next .t span { color: var(--accent); transition: transform .18s; }
.next:hover .t span { transform: translateX(4px); }

/* lightbox */
dialog.lb { border: 0; padding: 0; background: transparent; max-width: min(1200px, 94vw); max-height: 92vh; overflow: visible; }
dialog.lb::backdrop { background: rgba(0,0,0,.82); }
dialog.lb img { max-width: 100%; max-height: 86vh; width: auto; border-radius: 14px; margin: 0 auto; }
dialog.lb p { color: #ddd; text-align: center; margin-top: 10px; font-size: 14px; }
dialog.lb .x { position: absolute; top: -14px; right: -6px; width: 42px; height: 42px; border-radius: 50%; background: #fff; color: #111; font-size: 24px; line-height: 1; display: grid; place-items: center; }

/* CV viewer */
dialog.cvv { border: 0; padding: 0; background: var(--bg); color: var(--text); width: 100vw; height: 100vh; height: 100dvh; max-width: none; max-height: none; margin: 0; overflow: hidden; }
dialog.cvv[open] { display: flex; flex-direction: column; }
dialog.cvv::backdrop { background: rgba(0,0,0,.6); }
.cvv-bar { flex: none; display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--bg); }
.cvv-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 15px/1.3 var(--font-accent); }
.cvv-frame { flex: 1; width: 100%; border: 0; background: var(--surface-2); }
@media (min-width: 900px) {
  dialog.cvv { width: min(1000px, 94vw); height: 92vh; margin: auto; border-radius: 20px; border: 1px solid var(--border); }
}

/* reveal */
html.js .rv { opacity: 0; translate: 0 14px; transition: opacity .6s ease, translate .6s ease, transform .25s, border-color .25s; }
html.js .rv.in { opacity: 1; translate: none; }

/* ---------- breakpoints ---------- */
@media (min-width: 560px) {
  .header .cv-btn { display: inline-flex; }
  .header .in-btn { display: inline-grid; }
}
@media (max-width: 559px) {
  .contact { padding-top: 64px; }
  .contact-link:first-child { flex-direction: column; gap: 2px; padding-left: 16px; padding-right: 16px; }
  .contact-link small { font-size: 13px; }
  .footer-bar { margin-top: 44px; padding-top: 22px; flex-direction: column; align-items: flex-start; }
  .footer-bar .footer-in { align-self: flex-end; }
}
@media (min-width: 768px) {
  :root { --gutter: 28px; }
  section.block { padding: 96px 0; }
  .hero { padding: 72px 0 80px; }
  .hero-grid { grid-template-columns: 300px 1fr; gap: 56px; }
  .hero-photo { width: 100%; }
  .cases-grid { grid-template-columns: 1fr 1fr; }
  .about-card { padding: 44px; }
  .talk { grid-template-columns: 200px 1fr; padding: 28px; }
  .skills-grid { grid-template-columns: 1fr 1fr; }
  .career li { grid-template-columns: 200px 1fr; }
  .career-when { grid-row: span 2; padding-top: 6px; }
  .certs { grid-template-columns: 1fr 1fr; }
  .recs { grid-template-columns: 1fr 1fr; gap: 20px; }
  .rec { padding: 26px 26px 20px; }
  .contact-links { grid-template-columns: 1fr 1fr; }
  .contact-links .contact-link:first-child { grid-column: 1 / -1; }
  .meta-row { grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 24px; }
  .stats { grid-template-columns: repeat(3, 1fr); }
  .points { grid-template-columns: repeat(3, 1fr); }
  .edu { padding: 32px; }
}
@media (min-width: 1024px) {
  section.block { padding: 120px 0; }
  .hero-grid { grid-template-columns: 360px 1fr; gap: 72px; }
  .about-card { grid-template-columns: 1fr 300px; gap: 64px; padding: 56px; }
  .cases-grid { grid-template-columns: repeat(3, 1fr); }
  .skills-grid { grid-template-columns: repeat(3, 1fr); }
  .skill-group.wide { grid-column: span 2; }
  .certs { grid-template-columns: repeat(4, 1fr); }
  .case-layout { grid-template-columns: 220px 1fr; gap: 56px; }
  .toc { display: block; position: sticky; top: calc(var(--header-h) + 32px); align-self: start; }
  .toc .eyebrow { margin: 0 0 14px 0; }
}
@media (min-width: 1280px) {
  .nav { display: flex; }
  .menu-btn { display: none; }
  .mobile-nav { display: none !important; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { transition: none !important; animation: none !important; }
  html.js .rv { opacity: 1; translate: none; }
}

    figure('assets/reviews-charts.webp', 1554, 1058,
      lang === 'uk' ? 'Вихідні графіки з аналізу: відгуки, що називають конкретного провайдера (29 згадок: Yahoo 9, AOL 9, Outlook 6, Comcast 2, Hotmail/MSN 1, Spectrum 1, Microsoft 1); проблеми функції Email Cleanup; інші проблеми продукту.'
                    : 'Source charts from the analysis: reviews naming a specific provider (29 mentions: Yahoo 9, AOL 9, Outlook 6, Comcast 2, Hotmail/MSN 1, Spectrum 1, Microsoft 1); Email Cleanup feature problems; other product issues.', '');
}
function figure(src, w, h, cap, cls) {
  return '<figure class="figure ' + (cls || '') + '"><button type="button" class="frame" data-lb="' + src + '" data-cap="' + cap.replace(/"/g, '&quot;') + '" aria-label="' + u('enlarge') + '"><img src="' + src + '" alt="' + cap.replace(/"/g, '&quot;') + '" loading="lazy" width="' + w + '" height="' + h + '"></button><figcaption>' + cap + '</figcaption></figure>';
}

/* ================= home ================= */
function caseCard(c) {

    '<div class="card-foot"><span class="btn btn-primary btn-sm">' + u('readCase') + ' <span class="arr" aria-hidden="true">→</span></span>' +
    (c.team ? '<span class="tag">' + u('teamProject') + '</span>' : '') + '</div></div></a>';
}
function renderHome() {
  var segs = ['all'];
  var html = '' +
  '<section class="hero" id="home" data-sec="home"><div class="wrap hero-grid">' +
    '<div class="hero-photo rv"><img src="assets/olga.webp" alt="' + u('name') + '" width="720" height="1053" fetchpriority="high"></div>' +
    '<div class="rv hero-copy"><p class="hero-hi">' + u('hi') + '</p><h1 class="hero-title">' + u('heroTitle') + '</h1>' +
      '<p class="hero-pitch">' + u('heroPitch') + '</p>' +
      '<div class="hero-cta"><a class="btn btn-primary" href="#/contact">' + u('contact') + ' <span class="arr">→</span></a>' +
      '<a class="btn btn-secondary" href="#/cases">' + u('seeCases') + '</a></div>' +
      '<p class="domains">' + u('domains') + ': <b>Healthcare</b> · <b>Legaltech</b></p></div>' +
  '</div></section>' +

  '<section class="block" id="experience" data-sec="experience" style="padding-top:0"><div class="wrap"><div class="sec-head rv"><h2 class="sec-title">' + u('expTitle') + '</h2></div>' +
    '<div class="about-card rv"><ol class="career">' + JOBS.map(function (j) {
      return '<li><span class="career-when">' + t(j.when) + '</span><div><span class="career-role">' + t(j.role) + '</span>' + (j.path ? '<span class="career-path">' + t(j.path) + '</span>' : '') + '<span class="career-co">' + t(j.co) + '</span></div></li>';
    }).join('') + '</ol>' +
    '<div class="about-side"><div class="fact"><p class="eyebrow">' + u('domains') + '</p><p>Healthcare · Legaltech</p></div>' +
    '<div class="fact"><p class="eyebrow">' + u('langs') + '</p><p>' + u('langsText') + '</p></div></div></div>' +
    '<div class="skill-group experience-power rv"><h3>Power skills</h3><div class="tags">' + POWER_SKILLS.map(function (s) {
      return '<span class="tag skill">' + t(s) + '</span>';
    }).join('') + '</div></div></div></section>' +

  '<section class="block" id="cases" data-sec="cases" style="padding-top:0"><div class="wrap"><div class="sec-head rv"><h2 class="sec-title">' + u('casesTitle') + '</h2></div>' +
    '<div class="filters rv" role="group" aria-label="' + u('cases') + '">' + segs.map(function (s) {
      return '<button type="button" class="filter" data-filter="' + s + '" aria-pressed="' + (filter === s) + '">' + u(s) + '</button>';
    }).join('') + '</div><div id="hlNote"></div>' +
    '<div class="cases-grid">' + CASES.map(caseCard).join('') + '</div><p class="empty-note" id="emptyNote" hidden>' + u('empty') + '</p></div></section>' +

  '<section class="block" id="speaking" data-sec="speaking" style="padding-top:0"><div class="wrap"><div class="sec-head rv"><h2 class="sec-title">' + u('speakingTitle') + '</h2></div>' +
    TALKS.map(function (k) {
      return '<article class="talk rv"><div class="talk-date"><span class="badge" style="align-self:flex-start;background:var(--surface)">' + u('speaker') + '</span><div><div class="d">' + k.d + '</div><div class="m">' + t(k.m) + '</div></div></div>' +
        '<div><h3>' + t(k.title) + '</h3><div class="talk-meta"><span>' + u('event') + ': <b>' + t(k.event) + '</b></span><span>' + u('venue') + ': <b>' + t(k.venue) + '</b></span></div>' +
        '<p class="desc">' + t(k.desc) + '</p><div class="tags">' + t(k.tags).map(function (g) { return '<span class="tag">' + g + '</span>'; }).join('') + '</div></div></article>';
    }).join('') + '</div></section>' +

  '<section class="block" id="skills" data-sec="skills" style="padding-top:0"><div class="wrap"><div class="sec-head rv"><h2 class="sec-title">' + u('skillsTitle') + '</h2></div>' +
    '<div class="skills-grid">' + SKILLS.map(function (g) {
      return '<div class="skill-group rv' + (g.wide ? ' wide' : '') + '"><h3>' + t(g.g) + '</h3><div class="tags">' + g.items.map(function (s) {
        var cls = 'tag ' + (g.tool ? 'tool' : 'skill') + (s.c.length >= 2 ? ' key' : '');
        if (!s.c.length) return '<span class="' + cls + '">' + t(s) + '</span>';
        return '<button type="button" class="' + cls + '" data-skill="' + s.en + '" aria-pressed="' + (highlight === s.en) + '">' + t(s) + '</button>';
      }).join('') + '</div></div>';
    }).join('') + '</div></div></section>' +

  '<section class="block" id="certifications" data-sec="certifications" style="padding-top:0"><div class="wrap"><div class="sec-head rv"><h2 class="sec-title">' + u('certsTitle') + '</h2></div>' +
    '<div class="certs">' + CERTS.map(function (c) {
      var body = '<div class="cert-body"><p>' + t(c.org) + '</p><p>' + t(c.date) + '</p></div>';
      var action = c.img ? '<button type="button" class="btn btn-secondary btn-sm cert-open" data-lb="' + c.img + '" data-cap="' + t(c.title) + '" aria-label="' + u('certificate') + ': ' + t(c.title) + '">' + u('certificate') + '</button>' : '';
      return '<article class="cert rv"><div class="cert-heading"><h3>' + t(c.title) + '</h3>' + action + '</div>' + body + '</article>';
    }).join('') + '</div></div></section>' +

  '<section class="block" id="recommendations" data-sec="recommendations" style="padding-top:0"><div class="wrap"><div class="sec-head rv"><span class="eyebrow">' + u('recommendations') + '</span><h2 class="sec-title">' + u('recTitle') + '</h2></div>' +
    '<div class="recs">' + RECS.map(function (r) {
      return '<article class="rec rv"><span class="rec-mark" aria-hidden="true">\u201C</span>' +
        '<blockquote lang="en"><p>' + r.text + '</p></blockquote>' +
        (lang === 'uk' ? '<p class="rec-note">' + u('recOrig') + '</p>' : '') +
        '<div class="rec-foot"><div class="rec-who"><p class="rec-role">' + t(r.role) + '</p><p class="rec-meta">' + t(r.rel) + ' \u00B7 ' + t(r.when) + '</p></div>' +
        '<a class="icon-btn rec-in" href="' + r.url + '" target="_blank" rel="noopener noreferrer" aria-label="' + u('recView') + '" title="' + u('recView') + '">' + LI_SVG + '</a></div></article>';
    }).join('') + '</div>' +
    '<div class="recs-more rv"><a class="btn btn-primary" href="' + REC_URL + '" target="_blank" rel="noopener noreferrer">' + u('recAll') + ' <span class="arr" aria-hidden="true">\u2197</span></a></div></div></section>';
  return html;
}

/* ================= case page ================= */
function renderCase(c) {
  var i = CASES.indexOf(c), next = CASES[(i + 1) % CASES.length];
  var secs = c.sections.slice();
  var visual = c.cover === 'phone'
    ? '<div class="case-visual rv"><div class="cover cv-phone"><img src="assets/strava-1.webp" alt="Strava.Match — home with match notification" width="438" height="824"><img src="assets/strava-2.webp" alt="Strava.Match — onboarding: find a partner who actually shows up" width="444" height="818"><img src="assets/strava-3.webp" alt="Strava.Match — fitness level question" width="420" height="816"></div></div>'
    : (c.cover === 'type' ? '<div class="case-visual rv">' + cover(c) + '</div>' : '');
  var luna = figure('assets/luna-creative.webp', 680, 682, lang === 'uk' ? 'Приклад рекламного креативу: Luna Period Tracker.' : 'Ad creative example: Luna Period Tracker.', 'narrow');
  var body = secs.map(function (s) {
    var b = t(s.body).replace('__TAM__', tamCircles()).replace('__BARS__', reviewBars()).replace('__LUNA__', luna);
    return '<section class="cs rv" id="s-' + s.id + '"><h2>' + t(s.h) + '</h2>' + b + '</section>';
  }).join('');
  var skills = t(c.skills).map(function (s) { return '<span class="tag skill">' + s + '</span>'; }).join('');
  var tools = c.tools.map(function (s) { return '<span class="tag tool">' + s + '</span>'; }).join('');
  var list = c.artifacts.filter(function (a) { return a.url; });
  var arts = list.map(function (a) { return '<a class="btn btn-primary" href="' + a.url + '" target="_blank" rel="noopener noreferrer">' + t(a.label) + ' <span class="arr" aria-hidden="true">↗</span></a>'; }).join('');
  var docs = list.length ? '<div class="cta-row rv" style="margin-top:0">' + arts + '</div>' : '';
  var kit = '<section class="cs kit rv" id="s-kit"><h2>' + (tools ? u('skillsLbl') + ' · ' + u('toolsLbl') : u('skillsLbl')) + '</h2>' +
    '<div class="kit-row"><p class="eyebrow">' + u('skillsLbl') + '</p><div class="tags">' + skills + '</div></div>' +
    (tools ? '<div class="kit-row"><p class="eyebrow">' + u('toolsLbl') + '</p><div class="tags">' + tools + '</div></div>' : '') + '</section>';
  var toc = secs.map(function (s) { return '<li><a href="#s-' + s.id + '" data-toc="s-' + s.id + '">' + t(s.h).replace(/^(Part|Частина) 2 — .*/, lang === 'uk' ? 'Залучення' : 'Acquisition') + '</a></li>'; }).join('') +
    '<li><a href="#s-kit" data-toc="s-kit">' + u('skillsLbl') + '</a></li>';

  return '<article class="case-page"><div class="wrap">' +
    '<a class="back" href="#/cases"><span aria-hidden="true">←</span> ' + u('allCases') + '</a>' +
    '<header class="case-hero rv"><h1 tabindex="-1">' + t(c.title) + '</h1><p class="lead">' + t(c.line) + '</p>' +
      (c.team ? '<div class="meta-row"><div class="item"><p class="eyebrow">' + u('format') + '</p><p><span class="badge">' + u('teamProject') + '</span></p></div></div>' : '') +
      '</header>' + visual +
    '<div class="case-layout"><nav class="toc" aria-label="' + u('story') + '"><p class="eyebrow">' + u('story') + '</p><ol>' + toc + '</ol></nav>' +
    '<div class="case-sections">' + body + docs + kit +
      '<a class="next rv" href="#/case/' + next.id + '"><span class="eyebrow">' + u('nextCase') + '</span><span class="t">' + t(next.short) + ' <span aria-hidden="true">→</span></span></a>' +
    '</div></div></div></article>';
}

/* ================= chrome: nav, i18n, theme ================= */
function renderNav() {
  var links = NAV.map(function (k) { return '<a href="#/' + (k === 'home' ? '' : k) + '" data-nav="' + k + '">' + u(k) + '</a>'; }).join('');
  $('#nav').innerHTML = links;
  $('#mobileNav').innerHTML = links + '<a href="https://www.linkedin.com/in/olhatereshchenko/" target="_blank" rel="noopener noreferrer">LinkedIn</a><a class="btn btn-primary" href="assets/Olga_Tereshchenko_CV.pdf" target="_blank" rel="noopener" data-cv style="color:var(--bg);border:0;justify-content:center">' + u('cv') + '</a>';
}
function setActive(k) {
  $$('[data-nav]').forEach(function (a) { var on = a.dataset.nav === k; a.classList.toggle('active', on); if (on) a.setAttribute('aria-current', 'true'); else a.removeAttribute('aria-current'); });
}
function applyStatic() {
  document.documentElement.lang = lang === 'uk' ? 'uk' : 'en';
  $$('[data-i18n]').forEach(function (el) { el.textContent = u(el.dataset.i18n); });
  $$('[data-lang]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.lang === lang)); });
  $('#themeBtn').setAttribute('aria-label', u('theme'));
  $('#menuBtn').setAttribute('aria-label', u('menu'));
  renderNav();
}

/* ================= router ================= */
var spy = null, reveal = null;
function parse() {
  var h = location.hash.replace(/^#\/?/, '');
  var m = h.match(/^case\/([\w-]+)/);
  if (m) return { view: 'case', id: m[1] };
  return { view: 'home', sec: NAV.indexOf(h) > -1 || h === 'skills' ? h : '' };
}
function render(scroll) {
  var r = parse(), app = $('#app');
  if (spy) spy.disconnect();
  if (r.view === 'case') {
    var c = caseById(r.id);
    if (!c) { location.replace('#/cases'); return; }
    app.innerHTML = renderCase(c);
    document.title = t(c.short) + ' — ' + u('name');
    setActive('cases');
    if (scroll) { window.scrollTo(0, 0); var h1 = $('h1', app); if (h1) h1.focus({ preventScroll: true }); }
    watchToc();
  } else {
    app.innerHTML = renderHome();
    document.title = u('name') + ' — Product Manager';
    applyFilter(); applyHighlight();
    var sec = r.sec && r.sec !== 'home' ? r.sec : '';
    if (scroll) {
      var target = sec && document.getElementById(sec);
      if (target) { revealAll(); target.scrollIntoView(); target.setAttribute('tabindex', '-1'); target.focus({ preventScroll: true }); }
      else window.scrollTo(0, 0);
    }
    setActive(sec || 'home');
    watchSections();
  }
  observeReveal();
  closeMenu();
}

function watchSections() {
  if (!('IntersectionObserver' in window)) return;
  spy = new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (!e.isIntersecting) return;
      var k = e.target.dataset.sec;
      setActive(k === 'skills' ? 'cases' : k);
    });
  }, { rootMargin: '-45% 0px -50% 0px' });
  $$('[data-sec]').forEach(function (s) { spy.observe(s); });
  spy.observe($('#contact'));
  $('#contact').dataset.sec = 'contact';
}
function watchToc() {
  if (!('IntersectionObserver' in window)) return;
  spy = new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (!e.isIntersecting) return;
      $$('[data-toc]').forEach(function (a) { a.classList.toggle('active', a.dataset.toc === e.target.id); });
    });
  }, { rootMargin: '-35% 0px -60% 0px' });
  $$('.cs').forEach(function (s) { spy.observe(s); });
}
var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
function revealAll() { $$('.rv').forEach(function (el) { el.classList.add('in'); }); }
function observeReveal() {
  if (reduce || !('IntersectionObserver' in window)) { revealAll(); return; }
  if (reveal) reveal.disconnect();
  reveal = new IntersectionObserver(function (es) {
    es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); reveal.unobserve(e.target); } });
  }, { rootMargin: '0px 0px -8% 0px' });
  $$('.rv:not(.in)').forEach(function (el) { reveal.observe(el); });
}

/* ================= cases filter & skill highlight ================= */
function applyFilter() {
  $$('.case-card').forEach(function (el) { el.hidden = !(filter === 'all' || el.dataset.seg === filter); });
  $$('[data-filter]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.filter === filter)); });
  var en = $('#emptyNote'); if (en) en.hidden = $$('.case-card').some(function (el) { return !el.hidden; });
}
function findSkill(en) {
  for (var i = 0; i < SKILLS.length; i++) for (var j = 0; j < SKILLS[i].items.length; j++) if (SKILLS[i].items[j].en === en) return SKILLS[i].items[j];
  return null;
}
function applyHighlight() {
  var s = highlight && findSkill(highlight), note = $('#hlNote');
  $$('.case-card').forEach(function (el) {
    var hit = !!s && s.c.indexOf(el.dataset.id) > -1;
    el.classList.toggle('hit', hit); el.classList.toggle('dim', !!s && !hit);
  });
  $$('[data-skill]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.skill === highlight)); });
  if (note) note.innerHTML = s ? '<p class="hl-note">' + u('showing') + ': <span class="tag skill">' + t(s) + '</span><button type="button" class="btn btn-secondary btn-sm" data-clear>' + u('clear') + ' ×</button></p>' : '';
}

/* ================= events ================= */
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-cv],[data-filter],[data-skill],[data-clear],[data-lang],[data-lb],#themeBtn,#menuBtn,[data-toc]');
  if (!el) {
    var a = e.target.closest('a[href^="#/"]');
    if (a && a.getAttribute('href') === location.hash) { e.preventDefault(); render(true); }
    return;
  }
  if (el.dataset.filter) { filter = el.dataset.filter; highlight = null; applyFilter(); applyHighlight(); }
  else if (el.dataset.skill) {
    highlight = highlight === el.dataset.skill ? null : el.dataset.skill;
    filter = 'all'; applyFilter(); applyHighlight();
  }
  else if (el.hasAttribute('data-clear')) { highlight = null; applyHighlight(); }
  else if (el.dataset.lang) {
    if (el.dataset.lang === lang) return;
    lang = el.dataset.lang;
    try { localStorage.setItem('lang', lang); } catch (x) {}
    var y = window.scrollY; applyStatic(); render(false); revealAll(); window.scrollTo(0, y);
  }
  else if (el.hasAttribute('data-cv')) { if (cvOK()) { e.preventDefault(); openCv(); } }
  else if (el.dataset.lb) { openLb(el.dataset.lb, el.dataset.cap || ''); }
  else if (el.id === 'themeBtn') {
    var th = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
    document.documentElement.dataset.theme = th;
  }
  else if (el.id === 'menuBtn') { var open = !$('#mobileNav').classList.contains('open'); $('#mobileNav').classList.toggle('open', open); el.setAttribute('aria-expanded', String(open)); }
  else if (el.dataset.toc) { e.preventDefault(); var s = document.getElementById(el.dataset.toc); if (s) s.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth' }); }
});
function closeMenu() { $('#mobileNav').classList.remove('open'); $('#menuBtn').setAttribute('aria-expanded', 'false'); }
document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeMenu(); });

/* CV viewer: in-page PDF where the browser can show it; otherwise the link opens the PDF in a new tab. */
var cvv = $('#cvv');
function cvOK() {
  var ios = /iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  return !!(cvv && cvv.showModal && navigator.pdfViewerEnabled && !ios);
}
function openCv() {
  $('#cvvTitle').textContent = u('name') + ' \u2014 CV';
  $('#cvvDlT').textContent = u('cvDownload');
  $('#cvvClose').setAttribute('aria-label', u('cvClose'));
  var f = $('#cvvFrame'); if (!f.getAttribute('src')) f.setAttribute('src', 'assets/Olga_Tereshchenko_CV.pdf#view=FitH');
  cvv.showModal();
}
if (cvv) {
  $('#cvvClose').addEventListener('click', function () { cvv.close(); });
  cvv.addEventListener('click', function (e) { if (e.target === cvv) cvv.close(); });
}

var lb = $('#lb');
function openLb(src, cap) {
  $('#lbImg').src = src; $('#lbImg').alt = cap; $('#lbCap').textContent = cap;
  if (lb.showModal) lb.showModal(); else window.open(src, '_blank', 'noopener');
}
$('#lbClose').addEventListener('click', function () { lb.close(); });
lb.addEventListener('click', function (e) { if (e.target === lb) lb.close(); });

window.addEventListener('scroll', function () { $('#header').classList.toggle('scrolled', window.scrollY > 8); }, { passive: true });
window.addEventListener('hashchange', function () { if (!location.hash || location.hash.indexOf('#/') === 0) render(true); });

$('#year').textContent = new Date().getFullYear();
applyStatic();
render(true);
})();
</script>
